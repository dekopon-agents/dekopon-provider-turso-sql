name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    uses: dekopon-agents/provider-workflows/.github/workflows/release.yml@4cb9276ca166bee05c04e4c40ad9bca4b1f1065c # v3
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
