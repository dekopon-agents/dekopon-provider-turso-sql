name: Cut release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, without the v (1.2.3 or 1.2.3-rc.1)
        type: string
        required: true

jobs:
  cut:
    uses: dekopon-agents/provider-workflows/.github/workflows/cut-release.yml@c8404236c18bcff3e089677e99ec3075d14b5679 # v4
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
    secrets: inherit
