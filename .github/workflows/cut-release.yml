name: Cut release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, without the v (1.2.3 or 1.2.3-rc.1)
        type: string
        required: true

jobs:
  cut:
    uses: dekopon-agents/provider-workflows/.github/workflows/cut-release.yml@4cb9276ca166bee05c04e4c40ad9bca4b1f1065c # v3
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
    secrets: inherit
