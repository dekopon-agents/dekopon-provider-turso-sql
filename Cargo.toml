[workspace]

[package]
name = "dekopon-turso-sql-provider"
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"
description = "SQLite-compatible SQL capabilities for Dekopon, as a Wasm component backed by Turso"
repository = "https://github.com/dekopon-agents/dekopon-provider-turso-sql"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Plain crates.io versions, pinned exactly and together so the two cannot skew: they are published
# from one dekopon workspace at one version, and the CI mirror check derives the dekopon tag it
# fetches the WIT from off this resolved version. These were pinned by rev only because
# `dekopon-provider-storage` was added after the v0.9.0 tag and had not been published yet; a rev
# pin resolves against a branch that can be deleted and leaves nothing on crates.io to audit.
dekopon-provider-sdk = "=0.10.0"
dekopon-provider-storage = { version = "=0.10.0", default-features = false, features = ["durable-files"] }
serde_json = "1.0.151"
wit-bindgen = { version = "0.44.0", default-features = false, features = ["macros", "realloc"] }

# dekopon-agents/turso, branch `dekopon`. The fork carries only what
# wasm32-unknown-unknown needs; see that commit for the upstreamable split.
turso_core = { git = "https://github.com/dekopon-agents/turso", rev = "b4aad334991b5bc8cad9806ec2225bcd3593bfa6", default-features = false, features = ["fs", "uuid"] }

# Three getrandom majors are genuinely in the graph (0.2 via aes-gcm, 0.3 via
# rand 0.9, 0.4 via rand 0.10). Each needs its custom backend registered
# against the broker's entropy import; see src/io.rs.
getrandom02 = { package = "getrandom", version = "0.2", features = ["custom"] }
getrandom03 = { package = "getrandom", version = "0.3" }
getrandom04 = { package = "getrandom", version = "0.4" }

[dev-dependencies]
# Pinned exactly, and to the same version as the two dependencies above, for the same reason: the
# three are published together from one dekopon workspace and must not skew.
dekopon-provider-sdk-testkit = "=0.10.0"
divan = "0.1.21"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "exec"
harness = false

# Wasmtime and Cranelift compile the 11 MB component on every `FakeBroker`, and an unoptimised
# Cranelift takes about eighty seconds to do it. Optimising dependencies — but not this crate,
# which stays debuggable — turns the integration suite from eleven minutes into something anyone
# will actually run. `build.sh` builds `--release`, so none of this reaches the shipped component.
[profile.dev.package."*"]
opt-level = 2
