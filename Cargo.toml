[workspace]

[package]
name = "dekopon-turso-sql-provider"
version = "0.5.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "SQLite-compatible SQL capabilities for Dekopon, as a Wasm component backed by Turso"
repository = "https://github.com/dekopon-agents/dekopon-provider-turso-sql"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dekopon-provider-sdk = { git = "https://github.com/dekopon-agents/dekopon", rev = "16c17e8554d7142ba3ebb944930bbfae64bc2db6" }

# dekopon-agents/turso, branch `dekopon`. The fork carries only what
# wasm32-unknown-unknown needs; see that commit for the upstreamable split.
turso_core = { git = "https://github.com/dekopon-agents/turso", rev = "b4aad334991b5bc8cad9806ec2225bcd3593bfa6", default-features = false, features = ["fs", "uuid"] }

# Three getrandom majors are genuinely in the graph (0.2 via aes-gcm, 0.3 via
# rand 0.9, 0.4 via rand 0.10). Each needs its custom backend registered
# against the broker's entropy import; see src/io.rs.
getrandom02 = { package = "getrandom", version = "0.2", features = ["custom"] }
getrandom03 = { package = "getrandom", version = "0.3" }
getrandom04 = { package = "getrandom", version = "0.4" }

[dev-dependencies]
dekopon-provider-sdk-testkit = { git = "https://github.com/dekopon-agents/dekopon", rev = "16c17e8554d7142ba3ebb944930bbfae64bc2db6" }
dekopon-broker-host = { git = "https://github.com/dekopon-agents/dekopon", rev = "16c17e8554d7142ba3ebb944930bbfae64bc2db6" }
dekopon-capability = { git = "https://github.com/dekopon-agents/dekopon", rev = "16c17e8554d7142ba3ebb944930bbfae64bc2db6" }
dekopon-core = { git = "https://github.com/dekopon-agents/dekopon", rev = "16c17e8554d7142ba3ebb944930bbfae64bc2db6" }
dekopon-storage-host = { git = "https://github.com/dekopon-agents/dekopon", rev = "16c17e8554d7142ba3ebb944930bbfae64bc2db6" }
tempfile = "3"
divan = "0.1.21"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync"] }

[[bench]]
name = "exec"
harness = false

# Optimize test-time Wasmtime/Cranelift dependencies, not this crate. The
# storage-backed fixture caches one registry per test binary. `build.sh` builds
# release, so these dev settings do not reach the shipped component.
[profile.dev.package."*"]
opt-level = 2
