# The fleet-uniform dependency policy. `cargo deny --all-features check bans licenses sources
# advisories` runs it in CI and on a laptop; both graphs below are checked, because the shipped
# component and the native test harness resolve to different closures.
[graph]
targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-gnu"]
all-features = false

[advisories]
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]
exceptions = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Workspace-internal path dependencies carry no version (openobserve); that is not a wildcard.
allow-wildcard-paths = true
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/dekopon-agents/turso"]
